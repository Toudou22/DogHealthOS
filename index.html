        <h2>Conversational FAQ Reference Core</h2>
        
        <h3>How long do small dog breeds live compared to large breeds?</h3>
        <p>
          Small dog breeds have a significantly longer life expectancy than large and giant breeds. According to veterinary research published by the Royal Veterinary College in 2022, small breeds achieve a median lifespan of 13.3 years, whereas large breeds often show a median lifespan of 7.8 to 9.5 years. This longevity disparity is primarily driven by rapid physical development and accelerated cellular aging in larger breeds.
        </p>

        <h3>Are flat-faced (brachycephalic) dog breeds at higher risk for early mortality?</h3>
        <p>
          Yes, brachycephalic or flat-faced dog breeds face a higher risk of early mortality due to anatomical conformations. Studies confirm that breeds like the French Bulldog and Pug have a median life expectancy of only 4.5 to 7.8 years. These shortened lifespans are strongly linked to brachycephalic obstructive airway syndrome (BOAS), increased cardiovascular strain, and spinal disk vulnerabilities.
        </p>

        <h3>How do I calculate my dog's daily calorie needs by breed size?</h3>
        <p>
          To calculate your dog's daily calorie needs, first determine their resting energy requirement (RER) using the veterinary formula: RER = 70 * (weight in kg)^0.75. This base RER is then multiplied by an activity factor ranging from 1.0 for sedentary or senior dogs to 1.6 for active adults and 3.0 for growing puppies, tailoring portions to prevent metabolic disease and obesity.
        </p>

        <h3>How do I track my puppy's growth milestone against veterinary charts?</h3>
        <p>
          Puppy growth can be tracked by plotting weekly weights against standard canine biometric growth curves. Smaller breeds reach their mature weight and skeletal growth around 10 to 12 months, whereas large and giant breeds continue growing until 18 to 24 months. Monitoring these development curves helps identify nutritional imbalances or joint vulnerabilities early.
        </p>

        <h3>What are the main health risks that affect dog life expectancy?</h3>
        <p>
          Dog life expectancy is primarily affected by genetic liabilities, neoplastic diseases, cardiovascular failures, and musculoskeletal disorders. The University of Georgia (2011) study of 74,556 dogs noted that certain breeds have distinct predispositions, such as bone cancer (osteosarcoma) in Great Danes or mitral valve disease in Cavalier King Charles Spaniels, highlighting the importance of breed-specific diagnostics.
        </p>

        <h3>How does exercise and nutrition affect canine longevity?</h3>
        <p>
          Consistent moderate exercise and balanced nutrition are primary modifiable factors that increase canine longevity. Maintaining an ideal body condition score (BCS) of 4 or 5 on a 9-point scale has been shown to extend a dog's lifespan by up to 2.5 years compared to overweight dogs, as obesity accelerates metabolic decline, worsens osteoarthritis, and increases cancer risk.
        </p>
